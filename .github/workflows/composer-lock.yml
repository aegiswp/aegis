# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Generate Composer Lock

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "update" to run composer update (can alter vendor/aegis resolution)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-lock:
    name: Generate composer.lock
    runs-on: ubuntu-latest
    if: inputs.confirm == 'update'
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          tools: composer

      - name: Update composer.lock
        run: composer update --no-install --no-interaction

      - name: Validate composer.json and composer.lock
        run: composer validate --strict --no-interaction

      - name: Commit composer.lock
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if git diff --quiet composer.lock 2>/dev/null; then
            echo "No changes to composer.lock"
          else
            git add composer.lock
            git commit -m "chore: update composer.lock [skip ci]"
            git push
          fi
