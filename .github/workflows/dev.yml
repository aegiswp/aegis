# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Development Checks

on:
  push:
    branches: [ feature/* ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick-checks:
    name: Quick Development Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Quick lint check
        run: |
          npm run lint:js --if-present
          npm run lint:css --if-present
          npm run lint:pkg-json --if-present

      - name: Check build
        run: npm run build --if-present

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: mbstring, intl, dom, curl, json, libxml, xml, xmlwriter
          tools: composer

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: PHP syntax check
        run: |
          find . -name "*.php" \
            ! -path "./vendor/*" ! -path "./node_modules/*" \
            ! -path "./tools/scratch/*" ! -path "./tools/wpaudit/vendor/*" -print0 \
            | xargs -0 -n1 php -l > /tmp/php-lint.log 2>&1 \
            || { grep -v "^No syntax errors" /tmp/php-lint.log; exit 1; }

      - name: PHPCS quick check (errors only)
        run: vendor/bin/phpcs --report=summary --warning-severity=0

  audit-tool-tests:
    name: Audit Tool Tests
    runs-on: ubuntu-latest
    needs: quick-checks

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          tools: composer

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run all audit tool tests
        run: composer test:wpaudit
